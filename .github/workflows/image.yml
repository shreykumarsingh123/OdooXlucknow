name: Deployment image

on:
  push:
    branches: [main]
    paths: ["backend/**", "render.yaml", ".github/workflows/image.yml"]
  pull_request:
    paths: ["backend/**", "render.yaml", ".github/workflows/image.yml"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t brightloop-api-test backend
      - name: Run it against MySQL over TLS, set up as on the free host
        run: |
          DBPW=$(openssl rand -hex 16)
          SEED='Fresh@Secret9'
          docker network create net
          docker run -d --name db --network net -e MYSQL_ROOT_PASSWORD=$DBPW -e MYSQL_DATABASE=app mysql:8.0 --require-secure-transport=ON
          for i in $(seq 1 60); do docker exec db mysql -h127.0.0.1 -uroot -p$DBPW --ssl-mode=REQUIRED -e 'select 1' >/dev/null 2>&1 && break; sleep 3; done
          CA=$(docker exec db cat /var/lib/mysql/ca.pem)
          docker run -d --name app --network net -p 18080:8000 -e PORT=8000 -e DEBUG=false -e SECRET_KEY=$(openssl rand -base64 32) \
            -e DB_NAME=app -e DB_USER=root -e DB_PASSWORD=$DBPW -e DB_HOST=db -e DB_PORT=3306 -e "DB_CA_CERT=$CA" -e SEED_PASSWORD="$SEED" \
            -e RENDER_EXTERNAL_HOSTNAME=bl.test -e FRONTEND_URL=https://web.test -e CORS_ALLOWED_ORIGINS=https://web.test brightloop-api-test
          H=(-H 'Host: bl.test' -H 'X-Forwarded-Proto: https' -H 'Content-Type: application/json')
          U=http://127.0.0.1:18080
          code() { curl -s -m 20 -o /dev/null -w '%{http_code}' "$@"; }
          ready=no
          for i in $(seq 1 60); do [ "$(code "${H[@]}" $U/api/health/)" = 200 ] && ready=yes && break; sleep 3; done
          docker logs app 2>&1 | grep -v Applying | tail -25
          [ "$ready" = yes ]
          check() { echo "$1: $2 (want $3)"; [ "$2" = "$3" ]; }
          check "plain http redirects" "$(code -H 'Host: bl.test' $U/api/health/)" 301
          check "unknown host refused" "$(code -H 'Host: evil.test' -H 'X-Forwarded-Proto: https' $U/api/health/)" 400
          check "admin static served" "$(code "${H[@]}" $U/static/admin/css/base.css)" 200
          check "seeded business site" "$(code "${H[@]}" $U/api/public/sites/mb7k2q/)" 200
          check "login with SEED_PASSWORD" "$(code "${H[@]}" -d "{\"email\":\"asha@admin.com\",\"password\":\"$SEED\"}" $U/api/auth/login/)" 200
          check "public password refused" "$(code "${H[@]}" -d '{"email":"asha@admin.com","password":"Brightloop@123"}' $U/api/auth/login/)" 401
          if curl -s -m 20 "${H[@]}" -d '{"email":"meera@gmail.com"}' $U/api/auth/forgot-password/ | grep -q dev_otp; then echo "code exposed"; exit 1; fi
          docker exec db mysql -uroot -p$DBPW -e "show status like 'Ssl_accepts'"
          docker restart app
          ready=no
          for i in $(seq 1 40); do [ "$(code "${H[@]}" $U/api/health/)" = 200 ] && ready=yes && break; sleep 3; done
          [ "$ready" = yes ]
          [ "$(docker logs app 2>&1 | grep -c 'Seeded')" = 1 ]

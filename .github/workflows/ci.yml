name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Steps are skipped until the matching app exists, so CI stays green during planning.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
          MYSQL_DATABASE: odooxlko
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-not-a-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          python-version: "3.14"
      - name: Install MySQL client libraries
        if: hashFiles('backend/requirements.txt') != ''
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config
      - name: Install
        if: hashFiles('backend/requirements.txt') != ''
        run: pip install -r requirements.txt ruff
      - name: Lint
        if: hashFiles('backend/requirements.txt') != ''
        run: ruff check .
      - name: Test
        if: hashFiles('backend/manage.py') != ''
        env:
          DEBUG: "true"
          SECRET_KEY: ci-only-not-a-secret
          DB_NAME: odooxlko
          DB_USER: root
          DB_PASSWORD: ci-only-not-a-secret
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present
      - name: Test
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm test --if-present
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build
